<h1>聯絡我們</h1>
<p>歡迎填寫以下資料，我們將盡快回覆您。</p>
<form action="https://formsubmit.co/61213179@gm.chihlee.edu.tw" method="POST">
<input type="hidden" name="_subject" value="收到新的聯絡表單">
<input type="hidden" name="_template" value="table">
<input type="text" name="_honey" style="display:none">
<label>姓名</label>
<input type="text" name="name" placeholder="請輸入姓名" required>
<label>電話</label>
<input type="tel" name="phone" placeholder="請輸入電話" required>
<label>Email</label>
<input type="email" name="email" placeholder="請輸入Email" required>
<label>聯絡內容</label>
<textarea name="message" rows="6" placeholder="請輸入聯絡內容" required></textarea>
<button type="submit">送出表單</button>
</form>
